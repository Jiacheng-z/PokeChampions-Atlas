<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" role="img" aria-label="数据更新流程：抓取 OP.GG 双打榜 → 校验 → 备份 → 原子替换 data.json">
  <title>数据更新流程：抓取 → 校验 → 备份 → 原子替换 data.json</title>
  <defs>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC',system-ui,sans-serif}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c4c4cc"/>
    </marker>
  </defs>
  <rect width="1200" height="240" fill="#ffffff"/>

  <g>
    <!-- step 1 -->
    <rect x="40" y="70" width="200" height="100" rx="20" fill="#f2f2f7"/>
    <text x="140" y="112" text-anchor="middle" font-size="19" font-weight="600" fill="#1d1d1f">抓取</text>
    <text x="140" y="140" text-anchor="middle" font-size="14" fill="#6e6e73">OP.GG 双打榜 · TOP100</text>

    <line x1="248" y1="120" x2="300" y2="120" stroke="#c4c4cc" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- step 2 -->
    <rect x="308" y="70" width="200" height="100" rx="20" fill="#eef4ff"/>
    <text x="408" y="112" text-anchor="middle" font-size="19" font-weight="600" fill="#0071e3">校验</text>
    <text x="408" y="140" text-anchor="middle" font-size="14" fill="#6e6e73">50 只 + 关键字段</text>

    <line x1="516" y1="120" x2="568" y2="120" stroke="#c4c4cc" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- step 3 -->
    <rect x="576" y="70" width="200" height="100" rx="20" fill="#f2f2f7"/>
    <text x="676" y="112" text-anchor="middle" font-size="19" font-weight="600" fill="#1d1d1f">备份</text>
    <text x="676" y="140" text-anchor="middle" font-size="14" fill="#6e6e73">保留最近 14 份</text>

    <line x1="784" y1="120" x2="836" y2="120" stroke="#c4c4cc" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- step 4 -->
    <rect x="844" y="70" width="216" height="100" rx="20" fill="#e7f7ee"/>
    <text x="952" y="112" text-anchor="middle" font-size="19" font-weight="600" fill="#147d45">原子替换</text>
    <text x="952" y="140" text-anchor="middle" font-size="14" fill="#6e6e73">仅重写 data.json</text>
  </g>

  <text x="40" y="210" font-size="14" fill="#9a9aa0">抓取失败不覆盖现有数据 · index.html 永不被更新器修改</text>
</svg>
