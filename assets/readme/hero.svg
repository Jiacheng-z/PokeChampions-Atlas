<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" role="img" aria-label="PokeChampions Atlas — 宝可梦冠军赛双打对位图鉴与伤害估算">
  <title>PokeChampions Atlas — 宝可梦冠军赛双打对位图鉴与伤害估算</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f2f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0071e3"/>
      <stop offset="1" stop-color="#42a5ff"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="440" fill="url(#bg)"/>

  <!-- Left: title block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', system-ui, sans-serif">
    <rect x="72" y="86" width="150" height="34" rx="17" fill="#e8f2ff"/>
    <circle cx="94" cy="103" r="4.5" fill="#0071e3"/>
    <text x="108" y="108" font-size="16" font-weight="600" fill="#0071e3">双打 · TOP100</text>

    <text x="70" y="196" font-size="72" font-weight="700" fill="#1d1d1f" letter-spacing="-1.5">PokeChampions</text>
    <text x="70" y="270" font-size="72" font-weight="700" fill="url(#accent)" letter-spacing="-1.5">Atlas</text>

    <text x="72" y="322" font-size="23" font-weight="500" fill="#1d1d1f">宝可梦冠军赛 · 双打对位图鉴与伤害估算</text>
    <text x="72" y="356" font-size="18" fill="#6e6e73">离线单文件 · 我方 × 对手矩阵 · NCP 内核伤害计算</text>

    <g font-size="15" fill="#6e6e73">
      <text x="72" y="400">■ 纯静态 HTML</text>
      <text x="240" y="400" fill="#6e6e73">■ 本地数据</text>
      <text x="380" y="400" fill="#6e6e73">■ 无需构建</text>
    </g>
  </g>

  <!-- Right: matchup matrix motif -->
  <g transform="translate(720,64)" filter="url(#card)">
    <rect width="416" height="312" rx="24" fill="#ffffff"/>
    <!-- header row -->
    <text x="28" y="46" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#6e6e73">我方 \ 对手</text>
    <g transform="translate(150,30)">
      <circle cx="30" cy="12" r="13" fill="#78c850"/><circle cx="118" cy="12" r="13" fill="#f08030"/><circle cx="206" cy="12" r="13" fill="#6890f0"/>
    </g>
    <line x1="20" y1="66" x2="396" y2="66" stroke="#f0f0f2" stroke-width="1.5"/>

    <!-- rows -->
    <g font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600">
      <!-- row 1 -->
      <circle cx="46" cy="112" r="15" fill="#ee99ac"/>
      <g transform="translate(120,90)">
        <rect width="76" height="44" rx="12" fill="#e7f7ee"/><text x="38" y="28" text-anchor="middle" fill="#147d45">胜</text>
        <rect x="88" width="76" height="44" rx="12" fill="#fdeaea"/><text x="126" y="28" text-anchor="middle" fill="#d1434b">劣势</text>
        <rect x="176" width="76" height="44" rx="12" fill="#eef4ff"/><text x="214" y="28" text-anchor="middle" fill="#0071e3">互有</text>
      </g>
      <!-- row 2 -->
      <circle cx="46" cy="176" r="15" fill="#a890f0"/>
      <g transform="translate(120,154)">
        <rect width="76" height="44" rx="12" fill="#eef4ff"/><text x="38" y="28" text-anchor="middle" fill="#0071e3">互有</text>
        <rect x="88" width="76" height="44" rx="12" fill="#e7f7ee"/><text x="126" y="28" text-anchor="middle" fill="#147d45">胜</text>
        <rect x="176" width="76" height="44" rx="12" fill="#e7f7ee"/><text x="214" y="28" text-anchor="middle" fill="#147d45">胜</text>
      </g>
      <!-- row 3 -->
      <circle cx="46" cy="240" r="15" fill="#f8d030"/>
      <g transform="translate(120,218)">
        <rect width="76" height="44" rx="12" fill="#fdeaea"/><text x="38" y="28" text-anchor="middle" fill="#d1434b">劣势</text>
        <rect x="88" width="76" height="44" rx="12" fill="#eef4ff"/><text x="126" y="28" text-anchor="middle" fill="#0071e3">互有</text>
        <rect x="176" width="76" height="44" rx="12" fill="#e7f7ee"/><text x="214" y="28" text-anchor="middle" fill="#147d45">胜</text>
      </g>
    </g>

    <!-- damage chip -->
    <g transform="translate(28,272)">
      <rect width="120" height="30" rx="15" fill="#0071e3"/>
      <text x="60" y="20" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">计算伤害</text>
    </g>
    <text x="164" y="292" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#6e6e73">50 级 · 31 IV · NCP 阶段修正</text>
  </g>
</svg>
